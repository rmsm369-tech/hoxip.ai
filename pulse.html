<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
    <meta name="theme-color" content="#0a0a0f">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
    <title>Pulse - Music Discovery</title>
 
    <!-- Fonts -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Syne:wght@700;800&family=DM+Sans:wght@300;400;500;600&family=JetBrains+Mono:wght@400;600&display=swap" rel="stylesheet">
 
    <!-- Tone.js -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/tone/14.7.77/Tone.js"></script>
 
    <style>
        :root {
            --bg: #0a0a0f;
            --surface: #111118;
            --card: #16161f;
            --border: rgba(255,255,255,0.07);
            --text: #f0f0ff;
            --muted: rgba(240,240,255,0.5);
            --accent: #a78bfa;
            --accent2: #7eb8f7;
            --green: #34d399;
            --red: #f87171;
 
            --safe-bottom: env(safe-area-inset-bottom, 0px);
            --safe-top: env(safe-area-inset-top, 0px);
 
            --font-display: 'Syne', sans-serif;
            --font-body: 'DM Sans', sans-serif;
            --font-mono: 'JetBrains Mono', monospace;
        }
 
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            -webkit-tap-highlight-color: transparent;
        }
 
        body {
            background-color: var(--bg);
            color: var(--text);
            font-family: var(--font-body);
            overflow: hidden;
            overscroll-behavior-y: none;
            width: 100vw;
            height: 100vh;
            display: flex;
            flex-direction: column;
        }
 
        /* Glassmorphism Utilities */
        .glass {
            background: rgba(22, 22, 31, 0.7);
            backdrop-filter: blur(12px);
            -webkit-backdrop-filter: blur(12px);
            border: 1px solid var(--border);
        }
 
        .glass-surface {
            background: rgba(17, 17, 24, 0.85);
            backdrop-filter: blur(20px);
            -webkit-backdrop-filter: blur(20px);
        }
 
        /* Typography */
        h1, h2, h3 { font-family: var(--font-display); }
        .text-mono { font-family: var(--font-mono); }
        .text-muted { color: var(--muted); }
        .text-accent { color: var(--accent); }
        .truncate { white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
 
        /* Splash Screen */
        #splash {
            position: fixed;
            inset: 0;
            background: var(--bg);
            z-index: 9999;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            transition: opacity 0.5s ease, transform 0.5s ease;
        }
        .pulse-ring {
            width: 150px;
            height: 150px;
            border-radius: 50%;
            background: radial-gradient(circle, var(--accent) 0%, transparent 70%);
            animation: pulse-anim 2s infinite ease-out;
            position: absolute;
            z-index: -1;
        }
        @keyframes pulse-anim {
            0% { transform: scale(0.8); opacity: 0.8; }
            100% { transform: scale(2); opacity: 0; }
        }
        #splash h1 { font-size: 4rem; font-weight: 800; background: -webkit-linear-gradient(45deg, var(--accent), var(--accent2)); background-clip: text; -webkit-background-clip: text; -webkit-text-fill-color: transparent; margin-bottom: 0.5rem; }
        #splash p { font-size: 1.2rem; color: var(--muted); margin-bottom: 3rem; }
        .btn-enter {
            background: var(--accent); color: var(--bg); font-family: var(--font-display); font-weight: 700; font-size: 1.2rem;
            padding: 1rem 3rem; border-radius: 50px; border: none; box-shadow: 0 0 20px rgba(167, 139, 250, 0.4);
            min-height: 44px; min-width: 44px;
        }
 
        /* Top Bar */
        #top-bar {
            height: calc(60px + var(--safe-top));
            padding-top: var(--safe-top);
            display: flex;
            align-items: center;
            justify-content: space-between;
            padding-left: 1rem; padding-right: 1rem;
            position: sticky; top: 0; z-index: 50;
        }
        .icon-btn {
            background: transparent; border: none; color: var(--text); font-size: 1.5rem;
            width: 44px; height: 44px; display: flex; align-items: center; justify-content: center;
            border-radius: 50%; transition: background 0.3s ease; cursor: pointer;
        }
        .icon-btn:active { background: var(--border); }
        .brand { font-family: var(--font-display); font-weight: 700; font-size: 1.5rem; color: var(--accent); }
 
        /* Search Bar */
        #search-container {
            display: none;
            position: absolute; top: var(--safe-top); left: 0; right: 0; height: 60px;
            background: var(--surface); padding: 0 1rem; align-items: center; z-index: 51;
        }
        #search-container.active { display: flex; animation: slideDown 0.3s ease; }
        #search-input {
            flex: 1; background: var(--card); border: 1px solid var(--border); color: var(--text);
            padding: 0.8rem 1rem; border-radius: 50px; font-family: var(--font-body); font-size: 1rem; outline: none;
        }
        @keyframes slideDown { from { transform: translateY(-100%); } to { transform: translateY(0); } }
 
        /* Main Content Area */
        #main-content {
            flex: 1; overflow-y: auto; overflow-x: hidden; padding-bottom: calc(140px + var(--safe-bottom));
            scroll-behavior: smooth;
        }
        #main-content::-webkit-scrollbar { display: none; }
 
        /* Pills & Tabs */
        .pill-scroll { display: flex; overflow-x: auto; padding: 1rem; gap: 0.5rem; scroll-snap-type: x mandatory; }
        .pill-scroll::-webkit-scrollbar { display: none; }
        .pill {
            padding: 0.5rem 1.2rem; border-radius: 50px; background: var(--card); border: 1px solid var(--border);
            color: var(--text); font-family: var(--font-body); font-size: 0.9rem; white-space: nowrap; scroll-snap-align: start;
            min-height: 44px; display: flex; align-items: center; cursor: pointer; transition: 0.3s ease;
        }
        .pill.active { background: var(--accent); color: var(--bg); border-color: var(--accent); font-weight: 600; }
 
        /* Sections */
        .section-title { padding: 0 1rem; margin: 1rem 0; font-size: 1.2rem; }
        .track-list { display: flex; flex-direction: column; gap: 0.5rem; padding: 0 1rem; }
 
        /* Track Card */
        .track-card {
            display: flex; align-items: center; padding: 0.8rem; border-radius: 16px; transition: 0.3s ease; position: relative; overflow: hidden;
        }
        .track-card:active { transform: scale(0.98); }
        .track-card.playing { border-left: 3px solid var(--accent); box-shadow: -5px 0 15px rgba(167, 139, 250, 0.2); }
        .track-art { width: 48px; height: 48px; border-radius: 12px; object-fit: cover; background: linear-gradient(45deg, var(--card), var(--border)); }
        .track-info { flex: 1; margin-left: 1rem; overflow: hidden; }
        .track-title { font-weight: 500; font-size: 1rem; margin-bottom: 0.2rem; }
        .playing .track-title { color: var(--accent); }
        .marquee { animation: marquee 5s linear infinite; }
        @keyframes marquee { 0% { transform: translateX(0); } 100% { transform: translateX(-100%); } }
        .track-artist { font-size: 0.85rem; color: var(--muted); cursor: pointer; }
        .track-meta { display: flex; align-items: center; gap: 0.5rem; margin-top: 0.3rem; }
        .badge { font-size: 0.65rem; padding: 0.1rem 0.4rem; border-radius: 4px; background: var(--border); font-family: var(--font-mono); }
        .badge.jamendo { color: var(--green); } .badge.spotify { color: var(--accent2); }
        .track-actions { display: flex; align-items: center; gap: 0.5rem; }
 
        /* Skeleton */
        .skeleton { background: linear-gradient(90deg, var(--card) 25%, rgba(255,255,255,0.1) 50%, var(--card) 75%); background-size: 200% 100%; animation: shimmer 1.5s infinite; }
        @keyframes shimmer { 0% { background-position: 200% 0; } 100% { background-position: -200% 0; } }
        .skel-card { display: flex; align-items: center; padding: 0.8rem; border-radius: 16px; background: var(--card); border: 1px solid transparent; }
        .skel-art { width: 48px; height: 48px; border-radius: 12px; }
        .skel-line { height: 12px; border-radius: 6px; margin-bottom: 8px; }
 
        /* Persistent Bottom Player */
        #bottom-player {
            position: fixed; bottom: calc(60px + var(--safe-bottom)); left: 0; right: 0; height: 72px;
            margin: 0 0.5rem; border-radius: 16px; display: flex; align-items: center; padding: 0 1rem;
            z-index: 60; transform: translateY(150%); transition: transform 0.4s cubic-bezier(0.175, 0.885, 0.32, 1.275);
        }
        #bottom-player.visible { transform: translateY(0); }
        .bp-art { width: 40px; height: 40px; border-radius: 8px; object-fit: cover; }
        .bp-info { flex: 1; margin: 0 1rem; overflow: hidden; display: flex; flex-direction: column; justify-content: center; height: 100%; }
        .bp-progress-wrap { position: absolute; bottom: 0; left: 1rem; right: 1rem; height: 3px; background: var(--border); border-radius: 3px; overflow: hidden; }
        .bp-progress { height: 100%; background: var(--accent); width: 0%; transition: width 0.1s linear; }
 
        /* Bottom Nav */
        #bottom-nav {
            position: fixed; bottom: 0; left: 0; right: 0; height: calc(60px + var(--safe-bottom));
            padding-bottom: var(--safe-bottom); display: flex; justify-content: space-around; align-items: center;
            border-top: 1px solid var(--border); z-index: 50; background: var(--bg);
        }
        .nav-item {
            display: flex; flex-direction: column; align-items: center; justify-content: center;
            color: var(--muted); font-size: 0.75rem; width: 60px; height: 100%; gap: 0.2rem; min-height: 44px;
        }
        .nav-item.active { color: var(--accent); }
        .nav-icon { font-size: 1.4rem; }
 
        /* Sheets (Bottom overlays) */
        .sheet {
            position: fixed; top: 0; left: 0; right: 0; bottom: 0; background: var(--bg);
            z-index: 100; transform: translateY(100%); transition: transform 0.4s cubic-bezier(0.2, 0.8, 0.2, 1);
            display: flex; flex-direction: column;
        }
        .sheet.active { transform: translateY(0); }
        .sheet-handle { width: 40px; height: 5px; background: var(--border); border-radius: 5px; margin: 1rem auto; }
        .sheet-header { display: flex; justify-content: space-between; align-items: center; padding: 0 1rem 1rem; }
        .sheet-content { flex: 1; overflow-y: auto; padding: 1rem; }
        .sheet-content::-webkit-scrollbar { display: none; }
 
        /* Full Player Content */
        #full-player .album-art-large { width: calc(100vw - 4rem); height: calc(100vw - 4rem); max-width: 350px; max-height: 350px; margin: 2rem auto; border-radius: 20px; object-fit: cover; box-shadow: 0 20px 40px rgba(0,0,0,0.5); }
        .fp-controls { display: flex; justify-content: space-between; align-items: center; padding: 2rem; margin-top: auto; }
        .fp-main-btn { width: 64px; height: 64px; border-radius: 50%; background: var(--accent); color: var(--bg); display: flex; align-items: center; justify-content: center; font-size: 2rem; }
        .fp-time { display: flex; justify-content: space-between; font-size: 0.8rem; color: var(--muted); font-family: var(--font-mono); margin-top: 0.5rem; }
        #seek-bar { width: 100%; -webkit-appearance: none; background: transparent; height: 44px; }
        #seek-bar::-webkit-slider-runnable-track { width: 100%; height: 4px; background: var(--border); border-radius: 2px; }
        #seek-bar::-webkit-slider-thumb { -webkit-appearance: none; height: 16px; width: 16px; border-radius: 50%; background: var(--accent); margin-top: -6px; }
        canvas#visualizer { width: 100%; height: 80px; margin-top: 1rem; }
 
        /* Lyrics View */
        .lyric-line { font-size: 1.2rem; color: var(--muted); padding: 0.5rem 0; transition: 0.3s; cursor: pointer; min-height: 44px; display: flex; align-items: center; }
        .lyric-line.active { color: var(--text); font-size: 1.5rem; font-weight: 700; transform: scale(1.05); transform-origin: left; }
        .lyric-line.past { opacity: 0.3; }
 
        /* Toast */
        #toast-container { position: fixed; bottom: calc(140px + var(--safe-bottom)); left: 50%; transform: translateX(-50%) translateY(20px); opacity: 0; pointer-events: none; transition: 0.3s ease; z-index: 200; }
        .toast { padding: 0.8rem 1.5rem; border-radius: 50px; font-weight: 500; font-size: 0.9rem; text-align: center; box-shadow: 0 5px 15px rgba(0,0,0,0.3); }
        #toast-container.show { transform: translateX(-50%) translateY(0); opacity: 1; }
 
        /* Utilities */
        .hidden { display: none !important; }
        .flex { display: flex; } .items-center { align-items: center; } .justify-between { justify-content: space-between; }
        .mt-1 { margin-top: 1rem; } .mb-1 { margin-bottom: 1rem; }
    </style>
</head>
<body>
 
    <!-- Splash Screen -->
    <div id="splash">
        <div class="pulse-ring"></div>
        <h1>Pulse</h1>
        <p>Music without limits</p>
        <button class="btn-enter" onclick="unlockApp()">Enter Pulse</button>
    </div>
 
    <!-- App Container -->
    <div id="app" class="hidden">
 
        <!-- Top Bar -->
        <header id="top-bar" class="glass-surface">
            <button class="icon-btn">←</button>
            <div class="brand">Pulse</div>
            <button class="icon-btn" onclick="toggleSearch()">🔍</button>
        </header>
 
        <!-- Search Bar Overlay -->
        <div id="search-container">
            <input type="text" id="search-input" placeholder="Search tracks, artists, lyrics..." autocomplete="off">
            <button class="icon-btn" onclick="toggleSearch()">✕</button>
        </div>
 
        <!-- Main Content -->
        <main id="main-content">
 
            <!-- Context Tabs -->
            <div class="pill-scroll" id="main-tabs">
                <div class="pill active" data-tab="trending">Trending</div>
                <div class="pill" data-tab="new">New Releases</div>
                <div class="pill" data-tab="foryou">For You</div>
            </div>
 
            <!-- Genre Pills -->
            <div class="pill-scroll" id="genre-pills">
                <div class="pill active" data-genre="all">All</div>
                <div class="pill" data-genre="pop">Pop</div>
                <div class="pill" data-genre="rock">Rock</div>
                <div class="pill" data-genre="electronic">Electronic</div>
                <div class="pill" data-genre="hiphop">Hip-Hop</div>
                <div class="pill" data-genre="ambient">Ambient</div>
                <div class="pill" data-genre="jazz">Jazz</div>
                <div class="pill" data-genre="classical">Classical</div>
            </div>
 
            <!-- Track List Area -->
            <div id="track-container" class="track-list mt-1">
                <!-- Skeletons populated by JS initially -->
            </div>
 
            <!-- Sentinel for Infinite Scroll -->
            <div id="scroll-sentinel" style="height: 20px; width: 100%;"></div>
        </main>
 
        <!-- Bottom Player Bar -->
        <div id="bottom-player" class="glass" onclick="openFullPlayer(event)">
            <img src="" id="bp-art" class="bp-art" alt="Cover">
            <div class="bp-info">
                <div id="bp-title" class="track-title truncate">No track</div>
                <div id="bp-artist" class="track-artist truncate"></div>
            </div>
            <button class="icon-btn" id="bp-play" onclick="togglePlay(event)">▶</button>
            <button class="icon-btn" id="bp-next" onclick="playNext(event)">⏭</button>
            <div class="bp-progress-wrap"><div class="bp-progress" id="bp-progress"></div></div>
        </div>
 
        <!-- Bottom Navigation -->
        <nav id="bottom-nav">
            <div class="nav-item active"><span class="nav-icon">🎵</span><span>Discover</span></div>
            <div class="nav-item"><span class="nav-icon">📻</span><span>Radio</span></div>
            <div class="nav-item"><span class="nav-icon">🎚️</span><span>Studio</span></div>
            <div class="nav-item"><span class="nav-icon">🎙️</span><span>Record</span></div>
        </nav>
    </div>
 
    <!-- Full Player Sheet -->
    <div id="full-player" class="sheet glass-surface">
        <div class="sheet-handle" id="fp-handle"></div>
        <div class="sheet-header">
            <button class="icon-btn" onclick="closeSheet('full-player')">↓</button>
            <div style="font-family: var(--font-display); font-weight:700;">Now Playing</div>
            <button class="icon-btn" onclick="openSheet('queue-sheet')">☰</button>
        </div>
        <div class="sheet-content" style="display: flex; flex-direction: column;">
            <img src="" id="fp-art" class="album-art-large" alt="Cover">
            <div style="text-align: center; margin-top: 1rem;">
                <h2 id="fp-title" class="truncate" style="font-size: 1.5rem; margin-bottom: 0.5rem;">Title</h2>
                <p id="fp-artist" class="text-accent truncate" style="font-size: 1.1rem; cursor: pointer;" onclick="openArtistPage()">Artist</p>
            </div>
 
            <canvas id="visualizer"></canvas>
 
            <div style="margin-top: auto;">
                <input type="range" id="seek-bar" min="0" max="100" value="0">
                <div class="fp-time">
                    <span id="fp-time-curr">0:00</span>
                    <span id="fp-time-total">0:00</span>
                </div>
 
                <div class="fp-controls">
                    <button class="icon-btn" id="btn-shuffle" onclick="toggleShuffle()">🔀</button>
                    <button class="icon-btn" onclick="playPrev()">⏮</button>
                    <button class="fp-main-btn" id="fp-play" onclick="togglePlay(event)">▶</button>
                    <button class="icon-btn" onclick="playNext()">⏭</button>
                    <button class="icon-btn" id="btn-repeat" onclick="toggleRepeat()">🔁</button>
                </div>
 
                <div class="flex justify-between mt-1">
                    <button class="icon-btn" onclick="openSheet('lyrics-sheet')">📝</button>
                    <button class="icon-btn" onclick="shareTrack()">↗️</button>
                </div>
            </div>
        </div>
    </div>
 
    <!-- Lyrics Sheet -->
    <div id="lyrics-sheet" class="sheet glass-surface">
        <div class="sheet-handle"></div>
        <div class="sheet-header">
            <button class="icon-btn" onclick="closeSheet('lyrics-sheet')">↓</button>
            <div style="font-family: var(--font-display); font-weight:700;">Lyrics</div>
            <div style="width:44px;"></div>
        </div>
        <div class="sheet-content" id="lyrics-container" style="text-align: center; padding-bottom: 50vh;">
            <div class="text-muted mt-1">No lyrics loaded</div>
        </div>
    </div>
 
    <!-- Queue Sheet -->
    <div id="queue-sheet" class="sheet glass-surface">
        <div class="sheet-handle"></div>
        <div class="sheet-header">
            <button class="icon-btn" onclick="closeSheet('queue-sheet')">↓</button>
            <div style="font-family: var(--font-display); font-weight:700;">Up Next</div>
            <button class="icon-btn" onclick="clearQueue()">🗑</button>
        </div>
        <div class="sheet-content track-list" id="queue-container"></div>
    </div>
 
    <!-- Artist Overlay -->
    <div id="artist-overlay" class="sheet glass-surface">
        <div class="sheet-handle"></div>
        <div class="sheet-header">
            <button class="icon-btn" onclick="closeSheet('artist-overlay')">↓</button>
            <div style="font-family: var(--font-display); font-weight:700;">Artist Profile</div>
            <div style="width:44px;"></div>
        </div>
        <div class="sheet-content">
            <div style="text-align: center; margin-bottom: 2rem;">
                <h1 id="artist-name-title" style="font-size: 2rem; margin-bottom: 0.5rem;">Artist Name</h1>
                <div class="text-muted" id="artist-stats">Listeners: 0</div>
            </div>
            <div class="section-title">Top Tracks</div>
            <div id="artist-top-tracks" class="track-list mb-1"></div>
            <div class="section-title">About</div>
            <div id="artist-bio" class="text-muted" style="line-height: 1.5; font-size: 0.9rem;"></div>
        </div>
    </div>
 
    <!-- Toast Notification -->
    <div id="toast-container" class="glass"><div class="toast" id="toast-msg"></div></div>
 
    <!-- Core Audio Engine -->
    <audio id="core-player" crossorigin="anonymous"></audio>
 
<script>
/**
 * PULSE - CORE LOGIC
 */
const WORKER = 'https://pulse.rmsm369.workers.dev';
let audioCtx, analyser, dataArray, sourceNode;
let cache = { spotifyToken: '', spotifyTokenExpiry: 0 };
let state = {
    isPlaying: false,
    queue: [],
    currentIndex: -1,
    volume: 1,
    shuffle: false,
    repeat: 0, // 0: none, 1: all, 2: one
    currentTab: 'trending',
    currentGenre: 'all',
    page: 1,
    isLoading: false,
    lyrics: []
};
 
const DOM = {
    app: document.getElementById('app'),
    splash: document.getElementById('splash'),
    audio: document.getElementById('core-player'),
    trackContainer: document.getElementById('track-container'),
    queueContainer: document.getElementById('queue-container'),
    lyricsContainer: document.getElementById('lyrics-container'),
    searchInput: document.getElementById('search-input'),
    bottomPlayer: document.getElementById('bottom-player'),
    visualizer: document.getElementById('visualizer'),
    toast: document.getElementById('toast-container'),
    toastMsg: document.getElementById('toast-msg')
};
 
// --- INITIALIZATION ---
function initApp() {
    if(localStorage.getItem('pulse_unlocked') === 'true') {
        DOM.splash.style.display = 'none';
        DOM.app.classList.remove('hidden');
        setupAudioContext(); // Deferred until first interaction
        loadContent();
    }
    setupEventListeners();
    fetchSpotifyToken();
}
 
function unlockApp() {
    setupAudioContext();
    if(audioCtx.state === 'suspended') audioCtx.resume();
    localStorage.setItem('pulse_unlocked', 'true');
 
    DOM.splash.style.opacity = '0';
    DOM.splash.style.transform = 'scale(0.9)';
    setTimeout(() => {
        DOM.splash.style.display = 'none';
        DOM.app.classList.remove('hidden');
        loadContent();
    }, 500);
}
 
function setupAudioContext() {
    if(audioCtx) return;
    try {
        const AudioContext = window.AudioContext || window.webkitAudioContext;
        audioCtx = new AudioContext();
        analyser = audioCtx.createAnalyser();
        analyser.fftSize = 256;
        sourceNode = audioCtx.createMediaElementSource(DOM.audio);
        sourceNode.connect(analyser);
        analyser.connect(audioCtx.destination);
        dataArray = new Uint8Array(analyser.frequencyBinCount);
        drawVisualizer();
    } catch(e) { console.error('AudioContext error', e); }
}
 
// --- API & WORKER ---
async function fetchSpotifyToken() {
    if(Date.now() < cache.spotifyTokenExpiry) return;
    try {
        const res = await fetch(WORKER + '/spotify/token');
        const data = await res.json();
        cache.spotifyToken = data.access_token;
        cache.spotifyTokenExpiry = Date.now() + (3500 * 1000);
    } catch(e) { console.error('Spotify token fail'); }
}
 
async function requestWorker(path) {
    try {
        const res = await fetch(WORKER + path);
        if(!res.ok) throw new Error('Worker fetch failed');
        return await res.json();
    } catch(e) { return null; }
}
 
// --- CONTENT LOADING ---
async function loadContent(reset = true) {
    if(state.isLoading) return;
    state.isLoading = true;
    if(reset) { state.page = 1; DOM.trackContainer.innerHTML = generateSkeletons(6); }
 
    let tracks = [];
    if(state.currentTab === 'trending') {
        const query = state.currentGenre === 'all' ? '' : `?tags=${state.currentGenre}`;
        const data = await Promise.allSettled([
            requestWorker(`/jamendo${query}`),
            requestWorker(`/pixabay?q=${state.currentGenre === 'all' ? 'music' : state.currentGenre}`)
        ]);
        tracks = normalizeData(data);
    } else if (state.currentTab === 'new') {
        const data = await requestWorker(`/jamendo?order=releasedate_desc`);
        tracks = normalizeData([{status: 'fulfilled', value: data}]);
    } else if (state.currentTab === 'foryou') {
        // Fallback demo for foryou
        const data = await requestWorker(`/jamendo?tags=pop,rock`);
        tracks = normalizeData([{status: 'fulfilled', value: data}]);
    }
 
    renderTracks(tracks, reset);
    state.isLoading = false;
}
 
function normalizeData(results) {
    let combined = [];
    results.forEach(res => {
        if(res.status !== 'fulfilled' || !res.value) return;
        const data = res.value;
        if(data.results) { // Jamendo
            data.results.forEach(t => combined.push({
                id: 'j_'+t.id, title: t.name, artist: t.artist_name, 
                cover: t.image, audioUrl: t.audio, source: 'jamendo', duration: t.duration
            }));
        } else if (data.hits) { // Pixabay
            data.hits.forEach(t => combined.push({
                id: 'p_'+t.id, title: t.tags, artist: t.user, 
                cover: t.userImageURL || '', audioUrl: t.previewURL || t.audio, source: 'pixabay', duration: t.duration
            }));
        }
    });
    // Deduplicate logic simplistic
    return combined.filter((v,i,a)=>a.findIndex(v2=>(v2.title===v.title && v2.artist===v.artist))===i);
}
 
// --- SEARCH ---
let searchTimeout;
function toggleSearch() {
    const s = document.getElementById('search-container');
    s.classList.toggle('active');
    if(s.classList.contains('active')) DOM.searchInput.focus();
}
 
DOM.searchInput.addEventListener('input', (e) => {
    clearTimeout(searchTimeout);
    searchTimeout = setTimeout(() => performSearch(e.target.value), 400);
});
 
async function performSearch(query) {
    if(!query) return loadContent();
    DOM.trackContainer.innerHTML = generateSkeletons(5);
 
    await fetchSpotifyToken();
    const tokenStr = cache.spotifyToken ? `&token=${cache.spotifyToken}` : '';
 
    const results = await Promise.allSettled([
        requestWorker(`/jamendo?q=${encodeURIComponent(query)}`),
        requestWorker(`/pixabay?q=${encodeURIComponent(query)}`),
        requestWorker(`/spotify/search?q=${encodeURIComponent(query)}${tokenStr}`),
        requestWorker(`/fma?q=${encodeURIComponent(query)}`)
    ]);
 
    renderTracks(normalizeData(results), true);
}
 
// --- UI RENDERING ---
function generateSkeletons(count) {
    return Array(count).fill(`<div class="skel-card skeleton"><div class="skel-art"></div><div style="flex:1; margin-left:1rem;"><div class="skel-line" style="width:70%"></div><div class="skel-line" style="width:40%"></div></div></div>`).join('');
}
 
function renderTracks(tracks, reset) {
    const html = tracks.map((t, idx) => `
        <div class="track-card glass" data-id="${t.id}" onclick='playFromList(${JSON.stringify(t).replace(/'/g, "&#39;")})'>
            <img src="${t.cover || 'data:image/gif;base64,R0lGODlhAQABAAD/ACwAAAAAAQABAAACADs='}" class="track-art" loading="lazy">
            <div class="track-info">
                <div class="track-title truncate">${t.title}</div>
                <div class="track-artist truncate" onclick="event.stopPropagation(); loadArtist('${t.artist}')">${t.artist}</div>
                <div class="track-meta">
                    <span class="badge ${t.source}">${t.source}</span>
                    <span class="text-muted" style="font-size:0.7rem">${formatTime(t.duration)}</span>
                </div>
            </div>
            <div class="track-actions">
                <button class="icon-btn" onclick="event.stopPropagation(); addToQueue(${JSON.stringify(t).replace(/'/g, "&#39;")})">+</button>
            </div>
        </div>
    `).join('');
 
    if(reset) DOM.trackContainer.innerHTML = html;
    else DOM.trackContainer.insertAdjacentHTML('beforeend', html);
 
    if(tracks.length === 0 && reset) DOM.trackContainer.innerHTML = `<div class="text-muted" style="text-align:center; padding: 2rem;">Nothing found. Try different words.</div>`;
}
 
// --- PLAYER ENGINE ---
function playFromList(trackObj) {
    state.queue = [trackObj];
    state.currentIndex = 0;
    loadAndPlayTrack();
}
 
function addToQueue(trackObj) {
    state.queue.push(trackObj);
    showToast(`Added ${trackObj.title} to queue`, 'success');
    renderQueue();
}
 
function loadAndPlayTrack() {
    if(state.currentIndex < 0 || state.currentIndex >= state.queue.length) return;
    const t = state.queue[state.currentIndex];
 
    if(audioCtx && audioCtx.state === 'suspended') audioCtx.resume();
 
    DOM.audio.src = t.audioUrl;
    DOM.audio.play().then(() => {
        state.isPlaying = true;
        updatePlayerUI();
        addToHistory(t);
        fetchLyrics(t.artist, t.title);
    }).catch(e => {
        console.error('Playback error', e);
        showToast('Playback blocked. Tap screen to allow.', 'error');
    });
}
 
function togglePlay(e) {
    if(e) e.stopPropagation();
    if(state.queue.length === 0) return;
 
    if(state.isPlaying) {
        DOM.audio.pause();
        state.isPlaying = false;
    } else {
        if(audioCtx && audioCtx.state === 'suspended') audioCtx.resume();
        DOM.audio.play();
        state.isPlaying = true;
    }
    updatePlayerUI();
}
 
function playNext(e) {
    if(e) e.stopPropagation();
    if(state.queue.length === 0) return;
 
    if(state.shuffle) {
        state.currentIndex = Math.floor(Math.random() * state.queue.length);
    } else {
        state.currentIndex++;
        if(state.currentIndex >= state.queue.length) {
            if(state.repeat === 1) state.currentIndex = 0;
            else { state.currentIndex--; togglePlay(); return; }
        }
    }
    loadAndPlayTrack();
}
 
function playPrev() {
    if(DOM.audio.currentTime > 3) {
        DOM.audio.currentTime = 0;
    } else {
        state.currentIndex--;
        if(state.currentIndex < 0) state.currentIndex = state.queue.length - 1;
        loadAndPlayTrack();
    }
}
 
DOM.audio.addEventListener('ended', () => {
    if(state.repeat === 2) {
        DOM.audio.currentTime = 0;
        DOM.audio.play();
    } else {
        playNext();
    }
});
 
DOM.audio.addEventListener('timeupdate', () => {
    if(!DOM.audio.duration) return;
    const progress = (DOM.audio.currentTime / DOM.audio.duration) * 100;
    document.getElementById('bp-progress').style.width = `${progress}%`;
    document.getElementById('seek-bar').value = progress;
    document.getElementById('fp-time-curr').innerText = formatTime(DOM.audio.currentTime);
    document.getElementById('fp-time-total').innerText = formatTime(DOM.audio.duration);
 
    syncLyrics(DOM.audio.currentTime);
});
 
document.getElementById('seek-bar').addEventListener('input', (e) => {
    const time = (e.target.value / 100) * DOM.audio.duration;
    DOM.audio.currentTime = time;
});
 
// --- CROSSFADE SIMULATION ---
function fastCrossfade() {
    // True crossfade requires 2 audio nodes. We simulate by rapid volume fade.
    let vol = 1;
    const fadeOut = setInterval(() => {
        vol -= 0.1;
        if(vol <= 0) {
            clearInterval(fadeOut);
            DOM.audio.pause();
            playNext();
            DOM.audio.volume = 0;
            let volIn = 0;
            const fadeIn = setInterval(() => {
                volIn += 0.1;
                if(volIn >= 1) { volIn = 1; clearInterval(fadeIn); }
                DOM.audio.volume = volIn;
            }, 50);
        } else { DOM.audio.volume = vol; }
    }, 50);
}
 
// --- PLAYER UI UPDATES ---
function updatePlayerUI() {
    const t = state.queue[state.currentIndex];
    if(!t) return;
 
    DOM.bottomPlayer.classList.add('visible');
 
    document.getElementById('bp-art').src = t.cover || '';
    document.getElementById('bp-title').innerText = t.title;
    document.getElementById('bp-artist').innerText = t.artist;
 
    document.getElementById('fp-art').src = t.cover || '';
    document.getElementById('fp-title').innerText = t.title;
    document.getElementById('fp-artist').innerText = t.artist;
 
    const playIcon = state.isPlaying ? '⏸' : '▶';
    document.getElementById('bp-play').innerText = playIcon;
    document.getElementById('fp-play').innerText = playIcon;
 
    // Marquee logic
    const titleEl = document.getElementById('bp-title');
    if(titleEl.scrollWidth > titleEl.clientWidth && state.isPlaying) titleEl.classList.add('marquee');
    else titleEl.classList.remove('marquee');
 
    document.querySelectorAll('.track-card').forEach(el => {
        el.classList.remove('playing');
        if(el.dataset.id === t.id) el.classList.add('playing');
    });
}
 
// --- VISUALIZER ---
function drawVisualizer() {
    requestAnimationFrame(drawVisualizer);
    if(!analyser || !state.isPlaying) return;
 
    const canvas = DOM.visualizer;
    const ctx = canvas.getContext('2d');
    const width = canvas.width;
    const height = canvas.height;
 
    analyser.getByteFrequencyData(dataArray);
 
    ctx.clearRect(0, 0, width, height);
    const barWidth = (width / 64) * 2.5;
    let x = 0;
 
    for(let i = 0; i < 64; i++) {
        const barHeight = (dataArray[i] / 255) * (height / 2);
 
        const gradient = ctx.createLinearGradient(0, 0, 0, height);
        gradient.addColorStop(0, 'var(--accent)');
        gradient.addColorStop(1, 'var(--accent2)');
        ctx.fillStyle = gradient;
 
        ctx.fillRect(x, height/2 - barHeight, barWidth, barHeight);
        ctx.fillRect(x, height/2, barWidth, barHeight); // mirror
 
        x += barWidth + 1;
    }
}
 
// --- LYRICS SYSTEM ---
async function fetchLyrics(artist, title) {
    DOM.lyricsContainer.innerHTML = '<div class="text-muted mt-1">Searching lyrics...</div>';
    state.lyrics = [];
 
    try {
        const data = await requestWorker(`/lyrics/synced?artist=${encodeURIComponent(artist)}&title=${encodeURIComponent(title)}`);
        if(data && data.lrc) {
            parseLRC(data.lrc);
            renderLyrics();
        } else {
            DOM.lyricsContainer.innerHTML = '<div class="text-muted mt-1">No synced lyrics found.</div>';
        }
    } catch(e) { DOM.lyricsContainer.innerHTML = '<div class="text-muted mt-1">Error loading lyrics.</div>'; }
}
 
function parseLRC(lrc) {
    const lines = lrc.split('\n');
    const regex = /\[(\d{2}):(\d{2}\.\d{2,3})\](.*)/;
    state.lyrics = lines.map(line => {
        const match = line.match(regex);
        if(!match) return null;
        return {
            time: parseInt(match[1]) * 60 + parseFloat(match[2]),
            text: match[3].trim()
        };
    }).filter(l => l && l.text);
}
 
function renderLyrics() {
    DOM.lyricsContainer.innerHTML = state.lyrics.map((l, i) => 
        `<div class="lyric-line" id="lyric-${i}" onclick="seekLyric(${l.time})">${l.text}</div>`
    ).join('');
}
 
function syncLyrics(time) {
    if(!state.lyrics.length) return;
    let activeIdx = -1;
    for(let i = 0; i < state.lyrics.length; i++) {
        if(time >= state.lyrics[i].time) activeIdx = i;
        else break;
    }
 
    document.querySelectorAll('.lyric-line').forEach((el, i) => {
        if(i === activeIdx) {
            el.className = 'lyric-line active';
            el.scrollIntoView({ behavior: 'smooth', block: 'center' });
        } else if (i < activeIdx) {
            el.className = 'lyric-line past';
        } else {
            el.className = 'lyric-line';
        }
    });
}
 
function seekLyric(time) {
    DOM.audio.currentTime = time;
    if(!state.isPlaying) togglePlay();
}
 
// --- ARTIST PAGE ---
async function loadArtist(name) {
    openSheet('artist-overlay');
    document.getElementById('artist-name-title').innerText = name;
    document.getElementById('artist-bio').innerHTML = "Loading...";
    document.getElementById('artist-top-tracks').innerHTML = generateSkeletons(3);
 
    const [info, top] = await Promise.allSettled([
        requestWorker(`/lastfm/artist?name=${encodeURIComponent(name)}`),
        requestWorker(`/lastfm/top?artist=${encodeURIComponent(name)}`)
    ]);
 
    if(info.status === 'fulfilled' && info.value.artist) {
        document.getElementById('artist-stats').innerText = `Listeners: ${parseInt(info.value.artist.stats.listeners).toLocaleString()}`;
        document.getElementById('artist-bio').innerHTML = info.value.artist.bio.summary.replace(/<a.*?>.*?<\/a>/g, '');
    }
 
    if(top.status === 'fulfilled' && top.value.toptracks) {
        const tTracks = top.value.toptracks.track.slice(0, 5).map(t => ({
            id: t.name, title: t.name, artist: t.artist.name, source: 'lastfm', duration: t.duration || 0
        }));
        renderTracksHTML(tTracks, 'artist-top-tracks');
    }
}
 
function renderTracksHTML(tracks, containerId) {
    const html = tracks.map(t => `
        <div class="track-card glass" onclick="performSearch('${t.title} ${t.artist}')">
            <div class="track-info">
                <div class="track-title truncate">${t.title}</div>
                <div class="track-artist truncate">${t.artist}</div>
            </div>
            <button class="icon-btn">🔍</button>
        </div>
    `).join('');
    document.getElementById(containerId).innerHTML = html;
}
 
// --- UTILS & HELPERS ---
function formatTime(seconds) {
    if(!seconds || isNaN(seconds)) return "0:00";
    const m = Math.floor(seconds / 60);
    const s = Math.floor(seconds % 60);
    return `${m}:${s < 10 ? '0' : ''}${s}`;
}
 
function showToast(msg, type='info') {
    DOM.toastMsg.innerText = msg;
    if(type==='error') DOM.toastMsg.style.background = 'var(--red)';
    else if(type==='success') DOM.toastMsg.style.background = 'var(--green)';
    else DOM.toastMsg.style.background = 'var(--surface)';
 
    DOM.toast.classList.add('show');
    setTimeout(() => DOM.toast.classList.remove('show'), 2500);
}
 
function addToHistory(track) {
    let history = JSON.parse(localStorage.getItem('pulse_history') || '[]');
    history.unshift({ ...track, timestamp: Date.now() });
    if(history.length > 50) history.pop();
    localStorage.setItem('pulse_history', JSON.stringify(history));
}
 
// --- SHEETS & GESTURES ---
function openFullPlayer(e) {
    if(e.target.closest('.icon-btn')) return; // Ignore button clicks
    openSheet('full-player');
    // Ensure visualizer sizes correctly
    setTimeout(() => {
        DOM.visualizer.width = DOM.visualizer.offsetWidth;
        DOM.visualizer.height = 80;
    }, 400);
}
 
function openSheet(id) { document.getElementById(id).classList.add('active'); }
function closeSheet(id) { document.getElementById(id).classList.remove('active'); }
 
function renderQueue() {
    const html = state.queue.map((t, i) => `
        <div class="track-card glass ${i === state.currentIndex ? 'playing' : ''}">
            <div class="track-info">
                <div class="track-title truncate">${t.title}</div>
                <div class="track-artist truncate">${t.artist}</div>
            </div>
            <button class="icon-btn" onclick="state.currentIndex=${i}; loadAndPlayTrack()">▶</button>
        </div>
    `).join('');
    DOM.queueContainer.innerHTML = html;
}
function clearQueue() { state.queue = []; state.currentIndex = -1; renderQueue(); DOM.audio.pause(); DOM.bottomPlayer.classList.remove('visible'); }
 
function toggleShuffle() {
    state.shuffle = !state.shuffle;
    document.getElementById('btn-shuffle').style.color = state.shuffle ? 'var(--accent)' : 'var(--text)';
}
function toggleRepeat() {
    state.repeat = (state.repeat + 1) % 3;
    const btn = document.getElementById('btn-repeat');
    btn.style.color = state.repeat > 0 ? 'var(--accent)' : 'var(--text)';
    btn.innerText = state.repeat === 2 ? '🔂' : '🔁';
}
 
async function shareTrack() {
    const t = state.queue[state.currentIndex];
    if(!t) return;
    const shareData = { title: t.title, text: `Listening to ${t.title} by ${t.artist} on Pulse`, url: window.location.href };
    try {
        if(navigator.share) await navigator.share(shareData);
        else throw new Error();
    } catch(e) {
        navigator.clipboard.writeText(shareData.text);
        showToast('Link copied to clipboard!', 'success');
    }
}
 
// Gestures (Swipe down to close sheet)
document.querySelectorAll('.sheet').forEach(sheet => {
    let startY = 0;
    sheet.addEventListener('touchstart', e => { startY = e.changedTouches[0].screenY; });
    sheet.addEventListener('touchend', e => {
        if(e.changedTouches[0].screenY - startY > 100) sheet.classList.remove('active');
    });
});
 
// Infinite Scroll Observer
const observer = new IntersectionObserver(entries => {
    if(entries[0].isIntersecting && !state.isLoading && state.queue.length === 0) {
        state.page++;
        // loadContent(false); // Enable for actual infinite pagination
    }
}, { rootMargin: '100px' });
observer.observe(document.getElementById('scroll-sentinel'));
 
// Event Delegation for Tabs
document.getElementById('main-tabs').addEventListener('click', e => {
    if(e.target.classList.contains('pill')) {
        document.querySelectorAll('#main-tabs .pill').forEach(p => p.classList.remove('active'));
        e.target.classList.add('active');
        state.currentTab = e.target.dataset.tab;
        loadContent();
    }
});
document.getElementById('genre-pills').addEventListener('click', e => {
    if(e.target.classList.contains('pill')) {
        document.querySelectorAll('#genre-pills .pill').forEach(p => p.classList.remove('active'));
        e.target.classList.add('active');
        state.currentGenre = e.target.dataset.genre;
        loadContent();
    }
});
 
function setupEventListeners() {}
 
window.onload = initApp;
 
</script>
