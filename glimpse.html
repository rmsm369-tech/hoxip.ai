<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Glimpse — HOXIP</title>
  <link rel="manifest" href="manifest.json" />
  <link href="https://fonts.googleapis.com/css2?family=Syne:wght@400;600;700;800&family=DM+Sans:wght@300;400;500&display=swap" rel="stylesheet" />
  <style>
    :root {
      --bg:      #151720;
      --surface: #1e2130;
      --card:    #232636;
      --border:  rgba(255,255,255,0.07);
      --text:    #e8eaf0;
      --muted:   #7a7f94;
      --accent:  #22c55e;
      --nasa:    #f97316;
      --radius:  14px;
    }
    * { margin:0; padding:0; box-sizing:border-box; }
    body { background:var(--bg); color:var(--text); font-family:'DM Sans',sans-serif; min-height:100vh; }

    .topbar {
      position:sticky; top:0; z-index:100;
      background:rgba(21,23,32,0.9); backdrop-filter:blur(16px);
      border-bottom:1px solid var(--border);
      padding:12px 16px; display:flex; align-items:center; gap:12px;
    }
    .back-btn {
      background:none; border:none; color:var(--muted);
      font-size:20px; cursor:pointer; padding:4px 8px;
      border-radius:8px; text-decoration:none; transition:color .2s;
    }
    .back-btn:hover { color:var(--text); }
    .topbar-title { font-family:'Syne',sans-serif; font-size:20px; font-weight:800; flex:1; }
    .topbar-title span { color:var(--accent); }

    .tabs {
      display:flex; gap:8px; padding:14px 16px 0;
      border-bottom:1px solid var(--border);
      background:var(--bg); position:sticky; top:57px; z-index:99;
    }
    .tab-btn {
      background:none; border:none; color:var(--muted);
      font-family:'DM Sans',sans-serif; font-size:14px; font-weight:500;
      padding:8px 16px 12px; cursor:pointer;
      border-bottom:2px solid transparent; transition:all .2s;
    }
    .tab-btn.active      { color:var(--text); border-color:var(--accent); }
    .tab-btn.nasa-active { color:var(--text); border-color:var(--nasa); }
    .tab-btn:hover       { color:var(--text); }

    .search-wrap { padding:14px 16px; background:var(--bg); }
    .search-box {
      display:flex; align-items:center;
      background:var(--surface); border:1px solid var(--border);
      border-radius:50px; padding:0 16px; gap:10px; transition:border-color .2s;
    }
    .search-box:focus-within { border-color:var(--accent); }
    .search-icon { color:var(--muted); font-size:16px; }
    .search-input {
      flex:1; background:none; border:none; outline:none;
      color:var(--text); font-family:'DM Sans',sans-serif; font-size:14px; padding:11px 0;
    }
    .search-input::placeholder { color:var(--muted); }
    .search-clear { background:none; border:none; color:var(--muted); cursor:pointer; font-size:14px; display:none; }
    .search-clear.show { display:block; }

    .grid { columns:2; column-gap:10px; padding:10px 10px 80px; }
    @media(min-width:600px){ .grid{ columns:3; } }
    @media(min-width:900px){ .grid{ columns:4; } }

    .card {
      break-inside:avoid; margin-bottom:10px;
      border-radius:var(--radius); overflow:hidden;
      background:var(--card); position:relative; cursor:pointer;
      animation:fadeUp .4s ease both;
    }
    @keyframes fadeUp {
      from { opacity:0; transform:translateY(16px); }
      to   { opacity:1; transform:translateY(0); }
    }
    .card img { width:100%; display:block; object-fit:cover; background:var(--surface); min-height:80px; }
    .card-overlay {
      position:absolute; bottom:0; left:0; right:0;
      padding:28px 10px 10px;
      background:linear-gradient(transparent,rgba(0,0,0,0.8));
      opacity:0; transition:opacity .2s;
      display:flex; justify-content:space-between; align-items:flex-end; gap:8px;
    }
    .card:hover .card-overlay { opacity:1; }
    @media(hover:none){ .card-overlay{ opacity:1; } }
    .card-info { flex:1; min-width:0; }
    .card-title { font-size:11px; font-weight:500; color:#fff; white-space:nowrap; overflow:hidden; text-overflow:ellipsis; }
    .card-author { font-size:10px; color:rgba(255,255,255,0.6); margin-top:2px; }
    .dl-btn {
      background:rgba(255,255,255,0.15); backdrop-filter:blur(8px);
      border:none; color:#fff; width:30px; height:30px; border-radius:50%;
      display:flex; align-items:center; justify-content:center;
      cursor:pointer; flex-shrink:0; text-decoration:none; font-size:13px;
      transition:background .2s, transform .15s;
    }
    .dl-btn:hover { background:var(--accent); transform:scale(1.1); }

    .loader { display:flex; justify-content:center; padding:24px; }
    .spinner {
      width:28px; height:28px; border:3px solid var(--border);
      border-top-color:var(--accent); border-radius:50%;
      animation:spin .7s linear infinite;
    }
    .spinner.nasa-spin { border-top-color:var(--nasa); }
    @keyframes spin { to{ transform:rotate(360deg); } }

    .state-msg { text-align:center; padding:60px 24px; color:var(--muted); }
    .state-msg .emoji { font-size:40px; margin-bottom:12px; }
    .state-msg h3 { font-family:'Syne',sans-serif; font-size:18px; color:var(--text); margin-bottom:6px; }
    .state-msg p { font-size:13px; line-height:1.6; }

    .lightbox {
      display:none; position:fixed; inset:0; z-index:200;
      background:rgba(0,0,0,0.92); padding:16px;
      flex-direction:column; align-items:center; justify-content:center;
    }
    .lightbox.open { display:flex; }
    .lb-close {
      position:absolute; top:16px; right:16px;
      background:rgba(255,255,255,0.1); border:none; color:#fff;
      font-size:20px; width:40px; height:40px; border-radius:50%;
      cursor:pointer; display:flex; align-items:center; justify-content:center;
    }
    .lb-img { max-width:100%; max-height:70vh; border-radius:12px; object-fit:contain; }
    .lb-meta { margin-top:16px; text-align:center; max-width:500px; }
    .lb-meta h3 { font-family:'Syne',sans-serif; font-size:16px; margin-bottom:4px; }
    .lb-meta p { font-size:13px; color:var(--muted); line-height:1.5; max-height:80px; overflow-y:auto; }
    .lb-actions { display:flex; gap:10px; margin-top:14px; }
    .lb-dl {
      background:var(--accent); color:#000; font-weight:600; font-size:14px;
      padding:10px 22px; border:none; border-radius:50px; cursor:pointer;
      text-decoration:none; display:flex; align-items:center; gap:6px;
    }
    .lb-dl.nasa { background:var(--nasa); }
  </style>
</head>
<body>

  <div class="topbar">
    <a href="index.html" class="back-btn">←</a>
    <div class="topbar-title">✨ <span>Glimpse</span></div>
  </div>

  <div class="tabs">
    <button class="tab-btn active" id="tabUnsplash" onclick="switchTab('unsplash')">🌿 Unsplash</button>
    <button class="tab-btn" id="tabNasa" onclick="switchTab('nasa')">🚀 NASA</button>
  </div>

  <div class="search-wrap">
    <div class="search-box" id="searchBox">
      <span class="search-icon">🔍</span>
      <input type="text" class="search-input" id="searchInput" placeholder="Search photos…" autocomplete="off" />
      <button class="search-clear" id="searchClear" onclick="clearSearch()">✕</button>
    </div>
  </div>

  <div class="grid" id="grid"></div>
  <div class="loader" id="loader" style="display:none;"><div class="spinner" id="spinner"></div></div>
  <div id="sentinel" style="height:1px;"></div>

  <div class="lightbox" id="lightbox">
    <button class="lb-close" onclick="closeLightbox()">✕</button>
    <img class="lb-img" id="lbImg" src="" alt="" />
    <div class="lb-meta">
      <h3 id="lbTitle"></h3>
      <p id="lbDesc"></p>
    </div>
    <div class="lb-actions">
      <a class="lb-dl" id="lbDl" href="#" download target="_blank">⬇ Download</a>
    </div>
  </div>

<script>
  var WORKER_URL = 'https://glimpse.rmsm369.workers.dev';

  // NASA cycles through these topics so it never runs out
  var NASA_TOPICS = [
    'galaxy','nebula','mars','earth','moon','saturn','jupiter','hubble',
    'apollo','astronaut','rocket','stars','supernova','comet','aurora',
    'blackhole','telescope','iss','shuttle','cosmos','milkyway','sun',
    'venus','pluto','asteroid','spacecraft','deepspace','exoplanet'
  ];
  var nasaTopicIndex = 0;

  var activeTab   = 'unsplash';
  var page        = 1;
  var nasaPage    = 1;
  var query       = '';
  var loading     = false;
  var exhausted   = false;
  var searchTimer = null;

  var searchInput = document.getElementById('searchInput');
  var searchClear = document.getElementById('searchClear');
  var spinner     = document.getElementById('spinner');

  searchInput.addEventListener('input', function() {
    searchClear.classList.toggle('show', searchInput.value.length > 0);
    clearTimeout(searchTimer);
    searchTimer = setTimeout(function() {
      query = searchInput.value.trim();
      resetGrid();
      loadImages();
    }, 500);
  });

  var observer = new IntersectionObserver(function(entries) {
    if (entries[0].isIntersecting && !loading && !exhausted) loadImages();
  }, { rootMargin: '400px' });
  observer.observe(document.getElementById('sentinel'));

  function switchTab(tab) {
    activeTab = tab;
    document.getElementById('tabUnsplash').className = 'tab-btn' + (tab === 'unsplash' ? ' active' : '');
    document.getElementById('tabNasa').className     = 'tab-btn' + (tab === 'nasa' ? ' nasa-active' : '');
    spinner.className = 'spinner' + (tab === 'nasa' ? ' nasa-spin' : '');
    searchInput.placeholder = tab === 'unsplash' ? 'Search photos…' : 'Search NASA archive…';
    resetGrid();
    loadImages();
  }

  function resetGrid() {
    document.getElementById('grid').innerHTML = '';
    page = 1; nasaPage = 1; exhausted = false; nasaTopicIndex = 0;
  }

  function clearSearch() {
    searchInput.value = ''; query = '';
    searchClear.classList.remove('show');
    resetGrid(); loadImages();
  }

  function loadImages() {
    if (loading || exhausted) return;
    loading = true;
    document.getElementById('loader').style.display = 'flex';
    var p = (activeTab === 'unsplash') ? fetchUnsplash() : fetchNasa();
    p.then(function(items) {
      loading = false;
      document.getElementById('loader').style.display = 'none';
      if (!items || items.length === 0) {
        // NASA: cycle to next topic instead of stopping
        if (activeTab === 'nasa' && !query) {
          nasaTopicIndex = (nasaTopicIndex + 1) % NASA_TOPICS.length;
          nasaPage = 1;
          loadImages();
        } else {
          exhausted = true;
          if (!document.getElementById('grid').children.length) {
            document.getElementById('grid').innerHTML =
              '<div class="state-msg"><div class="emoji">🔍</div><h3>Nothing found</h3><p>Try a different search</p></div>';
          }
        }
      } else {
        renderCards(items);
        if (activeTab === 'unsplash') page++; else nasaPage++;
      }
    }).catch(function(err) {
      loading = false;
      document.getElementById('loader').style.display = 'none';
      // On error, try next NASA topic
      if (activeTab === 'nasa' && !query) {
        nasaTopicIndex = (nasaTopicIndex + 1) % NASA_TOPICS.length;
        nasaPage = 1;
        setTimeout(loadImages, 800);
      } else if (!document.getElementById('grid').children.length) {
        document.getElementById('grid').innerHTML =
          '<div class="state-msg"><div class="emoji">⚠️</div><h3>Failed to load</h3><p>' + err.message + '</p></div>';
      }
    });
  }

  function fetchUnsplash() {
    var endpoint = query ? 'unsplash/search' : 'unsplash/random';
    var params   = 'page=' + page + '&per_page=20' + (query ? '&query=' + encodeURIComponent(query) : '');
    return fetch(WORKER_URL + '/' + endpoint + '?' + params)
      .then(function(r) { if (!r.ok) throw new Error('Unsplash ' + r.status); return r.json(); })
      .then(function(data) {
        var photos = Array.isArray(data) ? data : (data.results || []);
        return photos.map(function(p) {
          return {
            id: p.id, src: p.urls.regular, full: p.urls.full,
            dl: p.links.download + '&force=true',
            title: p.alt_description || p.description || 'Photo',
            author: p.user ? p.user.name : 'Unsplash', desc: '', type: 'unsplash'
          };
        });
      });
  }

  function fetchNasa() {
    // If user is searching use their query, otherwise cycle through topics
    var q = query || NASA_TOPICS[nasaTopicIndex];
    var params = 'q=' + encodeURIComponent(q) + '&page=' + nasaPage + '&per_page=20';
    return fetch(WORKER_URL + '/nasa/search?' + params)
      .then(function(r) { if (!r.ok) throw new Error('NASA ' + r.status); return r.json(); })
      .then(function(data) {
        var items = (data.collection && data.collection.items) ? data.collection.items : [];
        return items
          .filter(function(i) { return i.links && i.links[0] && i.links[0].href; })
          .map(function(item) {
            var meta = (item.data && item.data[0]) ? item.data[0] : {};
            return {
              id: meta.nasa_id || Math.random(),
              src: item.links[0].href, full: item.links[0].href, dl: item.links[0].href,
              title: meta.title || 'NASA Image', author: meta.center || 'NASA',
              desc: meta.description || '', type: 'nasa'
            };
          });
      });
  }

  function renderCards(items) {
    var grid = document.getElementById('grid');
    items.forEach(function(item, i) {
      var card = document.createElement('div');
      card.className = 'card';
      card.style.animationDelay = (i % 10 * 40) + 'ms';
      card.innerHTML =
        '<img src="' + item.src + '" alt="' + esc(item.title) + '" loading="lazy" onerror="this.parentElement.style.display=\'none\'" />' +
        '<div class="card-overlay">' +
          '<div class="card-info">' +
            '<div class="card-title">' + esc(item.title) + '</div>' +
            '<div class="card-author">' + esc(item.author) + '</div>' +
          '</div>' +
          '<a class="dl-btn" href="' + item.dl + '" download target="_blank" onclick="event.stopPropagation()">⬇</a>' +
        '</div>';
      card.addEventListener('click', function() { openLightbox(item); });
      grid.appendChild(card);
    });
  }

  function openLightbox(item) {
    document.getElementById('lbImg').src = item.full || item.src;
    document.getElementById('lbTitle').textContent = item.title;
    document.getElementById('lbDesc').textContent  = item.desc || item.author;
    var dl = document.getElementById('lbDl');
    dl.href = item.dl;
    dl.className = 'lb-dl' + (item.type === 'nasa' ? ' nasa' : '');
    document.getElementById('lightbox').classList.add('open');
    document.body.style.overflow = 'hidden';
  }

  function closeLightbox() {
    document.getElementById('lightbox').classList.remove('open');
    document.getElementById('lbImg').src = '';
    document.body.style.overflow = '';
  }

  document.getElementById('lightbox').addEventListener('click', function(e) {
    if (e.target === this) closeLightbox();
  });

  function esc(s) {
    return String(s||'').replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;');
  }

  loadImages();
</script>
</body>
</html>
